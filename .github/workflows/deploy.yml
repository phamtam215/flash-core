# Deploy lên Cloud Run — Phase 7.
#
# CHỈ chạy khi CI đã xanh trên `main`, và **chỉ khi được bấm tay** (`workflow_dispatch`) hoặc
# push vào `main`. Không deploy từ pull request: PR chạy code của người lạ, và deploy nghĩa là
# trao cho code đó quyền của service account.
#
# Xác thực bằng **Workload Identity Federation**, KHÔNG phải service account key JSON. Key JSON
# là bí mật dài hạn nằm trong GitHub Secrets — rò một lần là rò mãi, và không ai biết nó rò.
# WIF đổi lấy token sống vài phút, gắn với đúng repo này.
#
# Secrets/vars phải đặt trước khi workflow chạy được (Settings → Secrets and variables):
#   vars:    GCP_PROJECT_ID · GCP_REGION · GCP_WIF_PROVIDER · GCP_SERVICE_ACCOUNT
#   secrets: DATABASE_URL_DIRECT  ← endpoint **direct** của Neon, chỉ dùng cho bước migrate
#            (mọi bí mật RUNTIME khác nằm ở Secret Manager, xem bước Deploy)
#
# Chi tiết cấu hình và các phương án đã loại: docs/adr/012-worker-tren-cloud-run.md

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false # deploy đang chạy dở mà bị huỷ là trạng thái tệ nhất

permissions:
  contents: read
  id-token: write # bắt buộc cho Workload Identity Federation

jobs:
  deploy:
    name: Build · Migrate · Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production

    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build và đẩy ảnh
        run: |
          IMAGE="${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/flash-core/api:${{ github.sha }}"
          gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      # Migration chạy ở **runner**, KHÔNG phải trong ảnh vừa build. Hai lý do, cả hai đều
      # là bug thật của bản đầu:
      #
      # 1. Ảnh runtime đã `npm prune --omit=dev`, mà `prisma` (CLI) và `typescript` đều là
      #    devDependency — `npx prisma migrate deploy` trong ảnh đó **không chạy được**, và
      #    `prisma.config.ts` cũng không nạp nổi. Mỗi lần deploy sẽ hỏng ở đúng bước này.
      # 2. ADR-013: Prisma khoá migration bằng **advisory lock mức session**, mà Neon pooler
      #    chạy transaction pooling nên không giữ được session ⇒ phải đi endpoint **direct**.
      #
      # Runner nối thẳng Neon được: Neon bảo vệ bằng chuỗi kết nối chứ không bằng IP
      # (spec Phase 7 §Bài toán #6 ý 5). Đổi lại `DATABASE_URL_DIRECT` phải là secret, không
      # bao giờ vào `vars` và không bao giờ vào log.
      #
      # Chạy TRƯỚC khi deploy: migrate hỏng thì dừng hẳn, không đẩy code mới lên schema cũ.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Chạy migration (endpoint direct)
        run: |
          npm ci
          npm run db:generate
          npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_DIRECT }}

      # Mọi con số dưới đây đến từ bảng §Cấu hình Cloud Run service của spec Phase 7, không
      # phải mặc định của gcloud. Ba cái đáng nhớ nhất:
      #   --max-instances 2   van an toàn KÉP: trần chi phí *và* trần connection tới Neon
      #                       (pool 5 × 2 instance = 10 connection).
      #   --concurrency 80    nhiều request chia nhau một instance ⇒ ít vCPU-giây hơn. Node
      #                       xử lý I/O-bound tốt nên đây gần như là bữa trưa miễn phí.
      #   --cpu-throttling    billing REQUEST-BASED: chỉ tính tiền lúc đang xử lý request.
      #                       Đây là cờ quyết định chi phí lớn nhất, và cũng chính là thứ làm
      #                       job nền không chạy được trong process này (xem ADR-012).
      # `INVENTORY_STRATEGY=pessimistic` theo số đo Phase 3: khi phần lớn request là "hết
      # hàng", pessimistic tốn 1 round-trip còn optimistic tốn 2.
      #
      # `METRICS_ENABLED=false` là MẶC ĐỊNH CÓ CHỦ Ý. Service để `--allow-unauthenticated` và
      # `MetricsController` không có guard nào, nên bật ở đây là công bố `/metrics` ra
      # Internet vĩnh viễn — lộ tên route, số đơn, tỉ lệ lỗi cho bất kỳ ai. Không ai scrape nó
      # cả. Muốn quay cảnh `curl /metrics` lúc demo thì bật TẠM bằng
      # `gcloud run services update flash-core-api --update-env-vars METRICS_ENABLED=true`,
      # quay xong tắt lại (spec Phase 7 §Câu hỏi mở #3).
      - name: Deploy API
        run: |
          gcloud run deploy flash-core-api \
            --image "$IMAGE" \
            --region "${{ vars.GCP_REGION }}" \
            --allow-unauthenticated \
            --min-instances 0 \
            --max-instances 2 \
            --concurrency 80 \
            --timeout 30s \
            --cpu 1 --memory 512Mi \
            --cpu-throttling \
            --set-env-vars NODE_ENV=production,LOG_LEVEL=info,COOKIE_SECURE=true,INVENTORY_STRATEGY=pessimistic,DATABASE_POOL_MAX=5,QUEUE_PREFIX=prod,METRICS_ENABLED=false \
            --set-secrets DATABASE_URL=DATABASE_URL:latest,REDIS_URL=REDIS_URL:latest,JWT_ACCESS_SECRET=JWT_ACCESS_SECRET:latest,JWT_REFRESH_SECRET=JWT_REFRESH_SECRET:latest,PAYMENT_WEBHOOK_SECRET=PAYMENT_WEBHOOK_SECRET:latest,CSRF_SECRET=CSRF_SECRET:latest \
            --quiet

      # Worker KHÔNG chạy như một service thức liên tục — Cloud Run free tier scale về 0.
      # Nó là một Job chạy một lượt rồi thoát, do Cloud Scheduler gọi **mỗi 5 phút** (ADR-012).
      #
      # 5 phút, KHÔNG phải 1 phút — và con số này được đặt bằng tay ngoài repo nên dòng chú
      # thích này chính là thứ người ta làm theo. 1 phút = 1.440 lượt/ngày × ~10s ≈ 432.000
      # vCPU-giây/tháng, vượt trần free 180.000 tới 2,4 lần, và giữ Neon thức gần như liên tục.
      - name: Deploy worker (Cloud Run Job)
        run: |
          gcloud run jobs deploy flash-core-worker \
            --image "$IMAGE" \
            --region "${{ vars.GCP_REGION }}" \
            --command node --args "dist/worker-once.js" \
            --set-env-vars NODE_ENV=production,LOG_LEVEL=info,INVENTORY_STRATEGY=pessimistic,DATABASE_POOL_MAX=5,QUEUE_PREFIX=prod \
            --set-secrets DATABASE_URL=DATABASE_URL:latest,REDIS_URL=REDIS_URL:latest,JWT_ACCESS_SECRET=JWT_ACCESS_SECRET:latest,JWT_REFRESH_SECRET=JWT_REFRESH_SECRET:latest,PAYMENT_WEBHOOK_SECRET=PAYMENT_WEBHOOK_SECRET:latest,CSRF_SECRET=CSRF_SECRET:latest \
            --max-retries 1 --task-timeout 120s --quiet

      # Cổng cuối: nếu readiness không xanh thì deploy coi như hỏng, dù `gcloud` đã trả về 0.
      - name: Kiểm tra readiness
        run: |
          URL=$(gcloud run services describe flash-core-api --region "${{ vars.GCP_REGION }}" --format 'value(status.url)')
          for i in $(seq 1 10); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' "$URL/ready" || true)
            [ "$CODE" = "200" ] && { echo "✓ $URL sẵn sàng"; exit 0; }
            echo "lần $i: /ready trả $CODE — chờ 5s (cold start)"; sleep 5
          done
          echo "✗ /ready không xanh sau 50 giây — lùi traffic về revision trước"
          PREV=$(gcloud run revisions list --service flash-core-api --region "${{ vars.GCP_REGION }}" \
                   --sort-by '~metadata.creationTimestamp' --format 'value(metadata.name)' --limit 2 | tail -1)
          if [ -n "$PREV" ]; then
            # Rollback chỉ đưa CODE về revision cũ — schema database KHÔNG lùi theo. Đó là lý
            # do luật "migration phải additive" ở spec Phase 7 §Bài toán #5: revision cũ bắt
            # buộc phải chạy được với schema mới.
            gcloud run services update-traffic flash-core-api --region "${{ vars.GCP_REGION }}" \
              --to-revisions "$PREV=100" --quiet
            echo "↩ đã lùi traffic về $PREV"
          fi
          exit 1
