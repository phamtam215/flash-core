# Deploy lên Cloud Run — Phase 7, hai môi trường theo ADR-017.
#
# KÍCH HOẠT BẰNG GIT TAG — cùng cách với hệ thống của công ty (OfficeCube):
#   v1.2.0-dev   → project dev   (GitHub Environment `dev`)
#   v1.2.0-prod  → project prod  (GitHub Environment `production`, có người duyệt)
# Không deploy từ pull request và không tự deploy khi `main` xanh: deploy là một quyết định có
# tên (tag), không phải tác dụng phụ của merge.
#
# Mọi giá trị riêng của từng môi trường (project, WIF, SA, instance Cloud SQL, chuỗi migrate)
# là biến/secret **của GitHub Environment**, không phải của repo. Vì vậy cùng một file này
# deploy được cả hai nơi, và secret của prod không bao giờ lộ cho job chạy ở dev.
#   Environment vars:    GCP_PROJECT_ID · GCP_WIF_PROVIDER · GCP_SERVICE_ACCOUNT · GCP_SQL_INSTANCE
#   Environment secrets: DATABASE_URL_MIGRATE ← nối 127.0.0.1:5432 qua Cloud SQL Auth Proxy
#   Repo vars (chung):   GCP_REGION
# (mọi bí mật RUNTIME khác nằm ở Secret Manager của từng project)
#
# Xác thực bằng **Workload Identity Federation**, KHÔNG phải service account key JSON (ADR-014).
#
# Chi tiết: docs/adr/017-moi-truong-va-phan-quyen-theo-mo-hinh-cong-ty.md,
#           docs/adr/012-worker-tren-cloud-run.md

name: Deploy

on:
  push:
    tags: ['v*-dev', 'v*-prod']

concurrency:
  # Mỗi môi trường một hàng đợi: deploy dev không chặn deploy prod và ngược lại.
  group: deploy-${{ endsWith(github.ref_name, '-prod') && 'production' || 'dev' }}
  cancel-in-progress: false # deploy đang chạy dở mà bị huỷ là trạng thái tệ nhất

permissions:
  contents: read
  id-token: write # bắt buộc cho Workload Identity Federation

jobs:
  # Chạy lại TOÀN BỘ CI trên đúng commit được gắn tag, thay vì tin rằng "chắc nó đã xanh trên
  # main rồi". Tag có thể gắn vào bất kỳ commit nào — kể cả một commit chưa từng qua CI.
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Build · Migrate · Deploy
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Chọn Environment theo đuôi tag. `production` có Required reviewers (cấu hình ở GitHub,
    # hướng dẫn deploy §18) nên job dừng ở đây chờ bấm duyệt — trước khi đụng tới bất cứ thứ gì.
    environment: ${{ endsWith(github.ref_name, '-prod') && 'production' || 'dev' }}
    env:
      DEPLOY_SHA: ${{ github.sha }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}
          fetch-depth: 0

      # Chỉ deploy commit ĐÃ vào `main`. Không có bước này thì gắn tag lên một nhánh chưa ai
      # review là lên được prod — đúng lỗ mà review PR sinh ra để chặn.
      - name: Commit phải nằm trên main
        run: |
          git merge-base --is-ancestor "$DEPLOY_SHA" origin/main \
            || { echo "✗ $GITHUB_REF_NAME trỏ vào commit chưa merge vào main"; exit 1; }

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build và đẩy ảnh
        run: |
          IMAGE="${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/flash-core/api:${{ env.DEPLOY_SHA }}"
          gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      # Migration chạy ở **runner**, KHÔNG phải trong ảnh vừa build. Hai lý do, cả hai đều
      # là bug thật của bản đầu:
      #
      # 1. Ảnh runtime đã `npm prune --omit=dev`, mà `prisma` (CLI) và `typescript` đều là
      #    devDependency — `npx prisma migrate deploy` trong ảnh đó **không chạy được**, và
      #    `prisma.config.ts` cũng không nạp nổi. Mỗi lần deploy sẽ hỏng ở đúng bước này.
      # 2. Runner không nằm trong GCP, và Cloud SQL **không mở IP cho ai** (ADR-016). Đường
      #    vào duy nhất là Cloud SQL Auth Proxy: nó xác thực bằng chính danh tính WIF ở bước
      #    `auth` (role `cloudsql.client`), mở một cổng local, và mã hoá tới instance.
      #
      # Chạy TRƯỚC khi deploy: migrate hỏng thì dừng hẳn, không đẩy code mới lên schema cũ.
      # Cloud SQL đang TẮT thì proxy đỏ ở đây — đúng thứ nên xảy ra: bật DB rồi chạy lại.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Mở Cloud SQL Auth Proxy
        run: |
          curl -sSfL -o cloud-sql-proxy \
            https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.14.1/cloud-sql-proxy.linux.amd64
          chmod +x cloud-sql-proxy
          # `--run-connection-test`: thử nối thật lúc khởi động và thoát nếu hỏng. Thiếu cờ này
          # thì proxy vẫn mở cổng dù instance đang tắt, và lỗi chỉ lộ ra ở bước sau dưới dạng
          # một câu khó hiểu của Prisma.
          ./cloud-sql-proxy --port 5432 --run-connection-test "${{ vars.GCP_SQL_INSTANCE }}" &
          for i in $(seq 1 20); do
            nc -z 127.0.0.1 5432 && { echo "✓ proxy sẵn sàng"; exit 0; }
            sleep 1
          done
          echo "✗ proxy không mở được — Cloud SQL đang tắt? (hướng dẫn deploy §15)"; exit 1

      - name: Chạy migration (qua proxy)
        run: |
          npm ci
          npm run db:generate
          npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_MIGRATE }}

      # Mọi con số dưới đây đến từ bảng §Cấu hình Cloud Run service của spec Phase 7, không
      # phải mặc định của gcloud. Ba cái đáng nhớ nhất:
      #   --max-instances 2   van an toàn KÉP: trần chi phí *và* trần connection tới Cloud
      #                       SQL (pool 5 × 2 instance = 10; db-f1-micro cho 25, ADR-016).
      #   --concurrency 80    nhiều request chia nhau một instance ⇒ ít vCPU-giây hơn. Node
      #                       xử lý I/O-bound tốt nên đây gần như là bữa trưa miễn phí.
      #   --cpu-throttling    billing REQUEST-BASED: chỉ tính tiền lúc đang xử lý request.
      #                       Đây là cờ quyết định chi phí lớn nhất, và cũng chính là thứ làm
      #                       job nền không chạy được trong process này (xem ADR-012).
      # `INVENTORY_STRATEGY=pessimistic` theo số đo Phase 3: khi phần lớn request là "hết
      # hàng", pessimistic tốn 1 round-trip còn optimistic tốn 2.
      #
      # `METRICS_ENABLED=false` là MẶC ĐỊNH CÓ CHỦ Ý. Service để `--allow-unauthenticated` và
      # `MetricsController` không có guard nào, nên bật ở đây là công bố `/metrics` ra
      # Internet vĩnh viễn — lộ tên route, số đơn, tỉ lệ lỗi cho bất kỳ ai. Không ai scrape nó
      # cả. Muốn quay cảnh `curl /metrics` lúc demo thì bật TẠM bằng
      # `gcloud run services update flash-core-api --update-env-vars METRICS_ENABLED=true`,
      # quay xong tắt lại (spec Phase 7 §Câu hỏi mở #3).
      #
      # `--service-account flash-core-runtime`: container chạy dưới SA riêng chỉ đọc được đúng
      # 6 secret của nó (quyền gắn theo từng secret), thay vì SA mặc định của Compute — mẫu của
      # hệ thống công ty (ADR-017).
      #
      # `--set-cloudsql-instances` gắn Unix socket `/cloudsql/<instance>` vào container —
      # `DATABASE_URL` trong Secret Manager trỏ vào socket đó (`?host=/cloudsql/...`).
      - name: Deploy API
        run: |
          gcloud run deploy flash-core-api \
            --image "$IMAGE" \
            --region "${{ vars.GCP_REGION }}" \
            --allow-unauthenticated \
            --min-instances 0 \
            --max-instances 2 \
            --concurrency 80 \
            --timeout 30s \
            --cpu 1 --memory 512Mi \
            --cpu-throttling \
            --set-cloudsql-instances "${{ vars.GCP_SQL_INSTANCE }}" \
            --service-account "flash-core-runtime@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com" \
            --set-env-vars NODE_ENV=production,LOG_LEVEL=info,COOKIE_SECURE=true,INVENTORY_STRATEGY=pessimistic,DATABASE_POOL_MAX=5,QUEUE_PREFIX=prod,METRICS_ENABLED=false \
            --set-secrets DATABASE_URL=DATABASE_URL:latest,REDIS_URL=REDIS_URL:latest,JWT_ACCESS_SECRET=JWT_ACCESS_SECRET:latest,JWT_REFRESH_SECRET=JWT_REFRESH_SECRET:latest,PAYMENT_WEBHOOK_SECRET=PAYMENT_WEBHOOK_SECRET:latest,CSRF_SECRET=CSRF_SECRET:latest \
            --quiet

      # Worker KHÔNG chạy như một service thức liên tục — Cloud Run free tier scale về 0.
      # Nó là một Job chạy một lượt rồi thoát, do Cloud Scheduler gọi **mỗi 5 phút** (ADR-012).
      #
      # 5 phút, KHÔNG phải 1 phút — và con số này được đặt bằng tay ngoài repo nên dòng chú
      # thích này chính là thứ người ta làm theo. 1 phút = 1.440 lượt/ngày × ~10s ≈ 432.000
      # vCPU-giây/tháng, vượt trần free 180.000 tới 2,4 lần.
      #
      # Khi tắt Cloud SQL để nghỉ thì PHẢI tạm dừng job Scheduler này cùng lúc — không thì
      # mỗi 5 phút một lượt worker nối vào DB đã tắt, đỏ, retry (hướng dẫn deploy §15).
      - name: Deploy worker (Cloud Run Job)
        run: |
          gcloud run jobs deploy flash-core-worker \
            --image "$IMAGE" \
            --region "${{ vars.GCP_REGION }}" \
            --command node --args "dist/worker-once.js" \
            --set-cloudsql-instances "${{ vars.GCP_SQL_INSTANCE }}" \
            --service-account "flash-core-runtime@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com" \
            --set-env-vars NODE_ENV=production,LOG_LEVEL=info,INVENTORY_STRATEGY=pessimistic,DATABASE_POOL_MAX=5,QUEUE_PREFIX=prod \
            --set-secrets DATABASE_URL=DATABASE_URL:latest,REDIS_URL=REDIS_URL:latest,JWT_ACCESS_SECRET=JWT_ACCESS_SECRET:latest,JWT_REFRESH_SECRET=JWT_REFRESH_SECRET:latest,PAYMENT_WEBHOOK_SECRET=PAYMENT_WEBHOOK_SECRET:latest,CSRF_SECRET=CSRF_SECRET:latest \
            --max-retries 1 --task-timeout 120s --quiet

      # Cổng cuối: nếu readiness không xanh thì deploy coi như hỏng, dù `gcloud` đã trả về 0.
      - name: Kiểm tra readiness
        run: |
          URL=$(gcloud run services describe flash-core-api --region "${{ vars.GCP_REGION }}" --format 'value(status.url)')
          for i in $(seq 1 10); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' "$URL/ready" || true)
            [ "$CODE" = "200" ] && { echo "✓ $URL sẵn sàng"; exit 0; }
            echo "lần $i: /ready trả $CODE — chờ 5s (cold start)"; sleep 5
          done
          echo "✗ /ready không xanh sau 50 giây — lùi traffic về revision trước"
          PREV=$(gcloud run revisions list --service flash-core-api --region "${{ vars.GCP_REGION }}" \
                   --sort-by '~metadata.creationTimestamp' --format 'value(metadata.name)' --limit 2 | tail -1)
          if [ -n "$PREV" ]; then
            # Rollback chỉ đưa CODE về revision cũ — schema database KHÔNG lùi theo. Đó là lý
            # do luật "migration phải additive" ở spec Phase 7 §Bài toán #5: revision cũ bắt
            # buộc phải chạy được với schema mới.
            gcloud run services update-traffic flash-core-api --region "${{ vars.GCP_REGION }}" \
              --to-revisions "$PREV=100" --quiet
            echo "↩ đã lùi traffic về $PREV"
          fi
          exit 1
