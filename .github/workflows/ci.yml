# CI của Phase 0: lint + typecheck + unit test. Mục tiêu là `main` luôn xanh
# (docs/git-workflow.md §1).
#
# Integration test ĐÃ BẬT (2026-09-21). Nó dùng **service container** của GitHub Actions thay
# vì Testcontainers: runner đã cấp sẵn Postgres + Redis trước khi job chạy, nên không phải
# dựng container từ trong Jest — nhanh hơn, và không phụ thuộc vào việc runner có cho nối
# `docker.sock` hay không. Đây chính là lối thoát `TEST_DATABASE_URL`/`TEST_REDIS_URL` mà
# `test/infra-fixture.ts` đã có sẵn cho máy dev.
#
# Tên database phải kết thúc bằng `_test` — `infra-fixture.ts` từ chối chạy nếu không, vì nó
# xoá sạch schema trước mỗi lần chạy.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint · Typecheck · Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Prisma Client được generate vào src/generated/, không commit → phải generate trước
      # khi typecheck, nếu không tsc sẽ không tìm thấy type của PrismaClient.
      #
      # DATABASE_URL cần có mặt vì `prisma.config.ts` đọc nó qua `env()`. `generate` không
      # thực sự kết nối DB, nên một URL giả là đủ — nhưng phải hợp lệ về cú pháp.
      - name: Generate Prisma Client
        run: npm run db:generate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public

      # Hai bước, có chủ ý — và ngưỡng được chọn bằng cách CHẠY THỬ, không theo cảm giác.
      #
      # Đo ngày 2026-09-22: 42 lỗ hổng `high`, 0 `critical`. Toàn bộ 42 cái là phụ thuộc
      # gián tiếp của Prisma (deepmerge-ts, fast-uri...) và đều ghi **"No fix available"**.
      #
      # Chặn ở `high` nghĩa là CI đỏ ngay hôm nay và đỏ mãi, vì **người sửa không có cách nào
      # làm nó xanh** — chờ Prisma phát hành bản mới là việc nằm ngoài tầm tay. Mà một cổng
      # luôn đỏ thì chỉ sau vài lần là người ta tắt nó đi, và lúc đó mất luôn cả cổng thật.
      #
      # Nên: CHẶN ở `critical` (chỗ gần như luôn có hành động làm được), và BÁO CÁO `high`
      # mà không chặn — vẫn nhìn thấy trong log, vẫn biết con số tăng hay giảm.
      - name: Chặn lỗ hổng critical
        run: npm audit --audit-level=critical

      - name: Báo cáo lỗ hổng high (không chặn)
        run: npm audit --audit-level=high || true

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit test
        run: npm test -- --coverage

      - name: Build
        run: npm run build

  integration:
    name: Integration test (Postgres + Redis thật)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: flashcore
          POSTGRES_PASSWORD: flashcore
          POSTGRES_DB: flashcore_test
        ports: ['5432:5432']
        # Không có health check thì job chạy `migrate deploy` khi Postgres còn đang khởi
        # động, và lỗi trông như "DB sai cấu hình" chứ không phải "chưa kịp lên".
        options: >-
          --health-cmd "pg_isready -U flashcore"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate
        env:
          DATABASE_URL: postgresql://flashcore:flashcore@localhost:5432/flashcore_test?schema=public

      - name: Integration test
        run: npm run test:int
        env:
          TEST_DATABASE_URL: postgresql://flashcore:flashcore@localhost:5432/flashcore_test?schema=public
          # DB index 1, không phải 0 — fixture từ chối FLUSHDB vào DB 0 (xem infra-fixture.ts).
          TEST_REDIS_URL: redis://localhost:6379/1
          # `migrate deploy` bên trong test đọc biến này.
          DATABASE_URL: postgresql://flashcore:flashcore@localhost:5432/flashcore_test?schema=public
